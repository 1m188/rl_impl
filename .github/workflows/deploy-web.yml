name: Deploy web to GitHub Pages

# 构建 web/ 下的前端项目，把 web/dist 发布到 GitHub Pages。
# on 加引号是为了避坑：YAML 1.1 会把裸写的 on 当成布尔 true（PyYAML 等工具会误读）
'on':
  push:
    branches: [master]
    # 只有 web/ 或本工作流自身变了才部署；改 Python 那边的文件不会触发
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  # 也可以在仓库的 Actions 页面手动点一次
  workflow_dispatch:

# Pages 发布需要的权限：读代码、写 Pages、用 OIDC 换一次性发布令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署：新推送排队等，不打断正在发布的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 web/dist
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # 锁文件在 web/ 下，不在仓库根目录
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # npm run build = vue-tsc --noEmit && vite build
      # 类型检查不过就会在这里失败，不会把坏产物发上去
      - name: 构建
        working-directory: web
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行自动把 Pages 的 source 设成 "GitHub Actions"。
          # 如果这一步报权限错误，就在仓库 Settings → Pages 里手动选一次：
          # Build and deployment → Source = GitHub Actions
          enablement: true

      - name: 上传 dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
